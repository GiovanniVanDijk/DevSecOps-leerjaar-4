name: CI/CD

on: push

jobs:
  build:
    name: Build & Push (Docker Hub & Harbor)
    # Hier dwingen we af dat de build op jouw lokale runner draait i.v.m. het lokale IP van Harbor
    runs-on: [self-hosted, local-runner]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Local Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
         
      - name: Build and push the Docker image to both registries
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            giovanni06/student-app:latest
            ${{ secrets.REGISTRY_URL }}/library/student-app:latest

  scan:
    name: Scan
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Docker Scout CVEs
        uses: docker/scout-action@v1.5.0
        with:
          command: cves
          image: giovanni06/student-app:latest
          only-severities: critical,high
          exit-code: false
          exit-on: vulnerability
          write-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test
    needs: [ scan ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start container locally for testing
        run: |
          docker run -d -p 80:5000 giovanni06/student-app:latest
          sleep 10s

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_TOKEN }}

      - name: Run Postman tests
        run: |
          postman collection run ${{ secrets.POSTMAN_COLLECTION_ID }}

      - name: Clean up container
        if: always()
        run: |
          docker ps -aq | xargs -r docker stop
          docker ps -aq | xargs -r docker rm

  deploy:
    name: Deploy to Local Environment
    needs: [ test ]
    # Dezelfde lokale runner pakt ook de deployment op
    runs-on: [self-hosted, local-runner]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - run: |
          sudo kubectl delete deployment --all            
          sudo kubectl apply -f ${{ github.workspace }}/kubernetes/deployment.yaml --force
          sudo kubectl apply -f ${{ github.workspace }}/kubernetes/nginx-service.yaml --force
