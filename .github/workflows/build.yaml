name: CI/CD

on: push

jobs:
  build:
    name: Build
    runs-on: self-hosted
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      ## - name: Login to Docker Hub
      ##   uses: docker/login-action@v2
      ##   with:
      ##     username: ${{ secrets.DOCKERHUB_USERNAME }}
      ##     password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Login to Local Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."192.168.40.135"]
              http = true
              insecure = true
          
      - name: Build and push the Docker image to Local Harbor
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/library/student-app:latest

  scan:
    name: Scan
    needs: [ build ]
    runs-on: self-hosted
    steps:
      ## - name: Login to Docker Hub
      ##   uses: docker/login-action@v2
      ##   with:
      ##     username: ${{ secrets.DOCKERHUB_USERNAME }}
      ##     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Local Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          
      - name: Docker Scout CVEs
        uses: docker/scout-action@v1.5.0
        with:
          command: cves
          image: ${{ secrets.REGISTRY_URL }}/library/student-app:latest
          only-severities: critical,high
          exit-code: false
          exit-on: vulnerability
          write-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test
    needs: [ scan ]
    runs-on: self-hosted
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      ## - name: Login to Docker Hub
      ##   uses: docker/login-action@v2
      ##   with:
      ##     username: ${{ secrets.DOCKERHUB_USERNAME }}
      ##     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Local Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Start container locally for testing
        run: |
          docker run -d -p 80:5000 ${{ secrets.REGISTRY_URL }}/library/student-app:latest
          # Geef de container 10 seconden om volledig op te starten voordat we testen
          sleep 10s

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_TOKEN }}

      - name: Run Postman tests
        run: |
          postman collection run ${{ secrets.POSTMAN_COLLECTION_ID }}

      - name: Clean up container
        # always() zorgt ervoor dat de container ook wordt verwijderd als de Postman test faalt
        if: always()
        run: |
          docker ps -aq | xargs -r docker stop
          docker ps -aq | xargs -r docker rm

  deploy:
    name: Deploy
    needs: [ test ]
    runs-on: self-hosted
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - run: |
          sudo kubectl delete deployment --all            
          sudo kubectl apply -f ${{ github.workspace }}/kubernetes/deployment.yaml --force
          sudo kubectl apply -f ${{ github.workspace }}/kubernetes/nginx-service.yaml --force
